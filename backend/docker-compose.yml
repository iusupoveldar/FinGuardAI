services:
  database:
    image: pgvector/pgvector:pg16
    container_name: finguard-database
    restart: unless-stopped

    environment:
      POSTGRES_DB: finguard
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard!20

    ports:
      - "5432:5432"

    volumes:
      - finguard_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U finguard -d finguard"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  finguard_postgres_data: